name: Kinatrip 发布提醒

on:
  schedule:
    # 每小时的 :00 和 :30 运行（UTC 时间）
    # 对应 EST 时间：:00 UTC = 20:00 EST前一天 | :30 UTC = 20:30 EST前一天
    # 实际每30分钟检查一次
    - cron: '0,30 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  check-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          persist-credentials: true  # 允许 git push

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行提醒检查
        env:
          SMTP_PWD: ${{ secrets.SMTP_PWD }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python check_and_remind.py

      - name: 提交 tracker 更新
        run: |
          git config user.email "${{ secrets.SMTP_EMAIL || 'ytityi@foxmail.com' }}"
          git config user.name "Kinatrip Reminder Bot"
          git add reminder_tracker.json
          git diff --cached --quiet || (git commit -m "Update reminder tracker [bot]" && git push)
